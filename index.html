<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Míša & Kristinka - Dobrodruzi v Zemi Pixelů</title>
  <link rel="stylesheet" href="/styles/game.css">
</head>
<body>
  <!-- Game Canvas -->
  <canvas id="game-canvas"></canvas>

  <!-- Start Screen (HTML overlay) -->
  <div id="start-screen">
    <div class="start-content">
      <h1 class="game-title">Míša & Kristinka</h1>
      <h2 class="game-subtitle">Dobrodruzi v Zemi Pixelů</h2>

      <div class="char-select">
        <div class="char-card" id="card-misa">
          <canvas id="portrait-misa" width="64" height="64"></canvas>
          <div class="char-name">★ Míša</div>
          <div class="char-desc">Čaroděj čísel</div>
        </div>
        <div class="char-card" id="card-kristinka">
          <canvas id="portrait-kristinka" width="64" height="64"></canvas>
          <div class="char-name">♥ Kristinka</div>
          <div class="char-desc">Umělkyně barev</div>
        </div>
      </div>

      <div class="room-actions">
        <button id="btn-single" class="btn btn-primary btn-big">Hrát sám</button>
        <div class="multiplayer-section">
          <p class="multiplayer-label">Hrát spolu:</p>
          <button id="btn-create" class="btn btn-secondary">Vytvořit místnost</button>
          <div class="join-row">
            <input id="room-code-input" type="text" placeholder="Kód" maxlength="5" class="input-code">
            <button id="btn-join" class="btn btn-secondary">Připojit se</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Lobby Screen -->
  <div id="lobby-screen" style="display:none">
    <div class="lobby-content">
      <h2>Čekáme na spoluhráče...</h2>
      <div class="lobby-code-display">
        Kód: <span id="lobby-code"></span>
      </div>
      <p class="lobby-hint">Řekni kamarádovi tento kód!</p>
      <div id="lobby-players"></div>
    </div>
  </div>

  <!-- Game UI (shown during gameplay) -->
  <div id="game-ui" style="display:none">
    <!-- D-pad (touch only) -->
    <div id="dpad" style="display:none">
      <button id="dpad-up" class="dpad-btn dpad-up">▲</button>
      <button id="dpad-left" class="dpad-btn dpad-left">◄</button>
      <button id="dpad-right" class="dpad-btn dpad-right">►</button>
      <button id="dpad-down" class="dpad-btn dpad-down">▼</button>
    </div>

    <!-- Action buttons (touch only) -->
    <div id="action-buttons" style="display:none">
      <button id="btn-interact" class="action-btn btn-interact">E</button>
      <button id="btn-jump" class="action-btn btn-jump">↑</button>
    </div>
  </div>

  <!-- Puzzle Overlay -->
  <div id="puzzle-overlay" style="display:none"></div>

  <!-- Celebration Overlay -->
  <div id="celebration-overlay" style="display:none"></div>

  <!-- Message toast -->
  <div id="message" style="display:none"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
